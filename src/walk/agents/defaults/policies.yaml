# Kernel default RuntimePolicy per role (§13-§20; E01-S17). Projects override keys in
# .ai/agents/policies.yaml: mappings merge recursively, scalars and lists replace.
# Model families per ADR-0011 D-3; concrete model ids are resolved by models.yaml (E01-S20).
# default_skills name builtin skills under walk/skills/builtin (E02-S05, WBS §3.10).
roles:
  ORCHESTRATOR:
    version: "1.0"
    model_policy: {preferred: [claude/opus], fallback: [codex/default]}
    effort_policy: {default: MEDIUM, min: LOW, max: HIGH}
    budget_policy: {}
    default_skills: [walk-output-contract]
    allowed_tools: [read, glob, grep, jira.create_task, jira.create_bug, jira.transition, work.plan]
    execution_strategy: single_run
    max_parallel_runs: 1
    checkpoint_every_tool_calls: 10
  PRODUCT_OWNER:
    version: "1.0"
    model_policy: {preferred: [claude/opus], fallback: [codex/default]}
    effort_policy: {default: MEDIUM, min: LOW, max: HIGH}
    budget_policy: {}
    default_skills: []
    allowed_tools: [read, glob, grep]
    execution_strategy: single_run
    max_parallel_runs: 1
    checkpoint_every_tool_calls: 10
  SCRUM_MASTER:
