[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "walk"
version = "0.1.0"
description = "WAL-K: Workflow Agent Layers Kernel, an AI game studio production kernel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6",
    "httpx>=0.27",
    "python-ulid>=2",
    "keyring>=25",
    "jinja2>=3.1",
]

[project.optional-dependencies]
claude = ["claude-agent-sdk"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2",
    "types-PyYAML",
]

[project.scripts]
walk = "walk.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/walk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "*.md"]  # planning docs hold abbreviated signature sketches

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # conflicts with D211 (blank line before class docstring)
    "D213",    # conflicts with D212 (summary on first line)
    "COM812",  # handled by the formatter
    "ISC001",  # handled by the formatter
    "PLR0913", # protocol methods mirror INTERFACES.md signatures with many args
    "ANN401",  # JsonDict payloads are Any by contract
    "TD002",   # TODOs carry story ids, not authors
    "TD003",   # TODOs carry story ids, not links
    "FIX002",  # TODOs are tracked by story id
    "CPY001",  # no per-file copyright headers in this repository
    "N818",    # exception names are fixed by ARCHITECTURE §5.1 (no Error suffix)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D1", "ARG001", "INP001", "S603", "S607", "TID251"]
"src/walk/cli/**" = ["FBT001", "FBT002", "TID251"]  # typer flags; the CLI owns typer
"scripts/**" = [  # planning tooling, not kernel code
    "INP001", "T201", "D103", "E501", "C901", "PLR0912", "PLR0915", "PLR2004", "PERF401",
    "TID251",
]
# SDK and subprocess confinement (ARCHITECTURE 2.3): the only kernel files allowed TID251.
"src/walk/model_router/adapters/claude/**" = ["TID251"]  # claude_agent_sdk
"src/walk/integrations/credentials.py" = ["TID251"]  # keyring (E02-S01)
"src/walk/integrations/subprocess.py" = ["TID251"]  # subprocesses of git, unity, graphify
"src/walk/model_router/adapters/codex/process.py" = ["TID251"]  # the codex CLI

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"claude_agent_sdk".msg = "only walk/model_router/adapters/claude/ may use the Claude SDK"
"typer".msg = "only walk/cli/ may use typer"
"keyring".msg = "only walk/integrations/credentials.py (CredentialStore) may use keyring"
"subprocess".msg = "spawn processes through walk.integrations.SubprocessRunner"
"asyncio.create_subprocess_exec".msg = "spawn processes through walk.integrations.SubprocessRunner"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=walk --cov-report=term-missing --cov-fail-under=85 -m 'not integration'"
markers = ["integration: needs real external services; skipped by default"]

[tool.coverage.run]
omit = ["scripts/*"]

# Package dependency rules of ARCHITECTURE 2.1-2.2 on direct imports (E01-S31); one contract per
# table row lists exactly its forbidden cells among the packages that exist.
[tool.importlinter]
root_package = "walk"

[[tool.importlinter.contracts]]
name = "common: ARCHITECTURE 2.2 row"
type = "forbidden"
source_modules = ["walk.common"]
forbidden_modules = ["walk.persistence", "walk.telemetry", "walk.hooks", "walk.workflow", "walk.budgets", "walk.effort", "walk.permissions", "walk.tools", "walk.skills", "walk.integrations", "walk.memory", "walk.decisions", "walk.debate", "walk.context", "walk.agents", "walk.model_router", "walk.runtime", "walk.improvement", "walk.orchestrator"]
allow_indirect_imports = true

